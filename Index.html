<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionale Multi-Magazzino</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1, h2 { color: #0066cc; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: span 2; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { background-color: #0066cc; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; grid-column: span 2; }
        button:hover { background-color: #004999; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        /* Stile Notifica Visiva */
        #notifica { display: none; position: fixed; top: 20px; right: 20px; background-color: #28a745; color: white; padding: 15px 20px; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Notifica Visiva a Schermo -->
    <div id="notifica">Operazione completata con successo!</div>

    <div class="container">
        <h1>📦 Gestionale Multi-Magazzino</h1>

        <!-- Sezione Inserimento Ordine -->
        <div class="section">
            <h2>Nuovo Ordine</h2>
            <form id="ordineForm">
                <div class="form-group">
                    <label>ID Magazzino:</label>
                    <input type="number" id="magazzino_id" value="1" required>
                </div>
                <div class="form-group">
                    <label>Fornitore:</label>
                    <input type="text" id="fornitore" placeholder="Nome fornitore" required>
                </div>
                <div class="form-group">
                    <label>Venditore (Chi fa l'ordine):</label>
                    <input type="text" id="venditore" value="PIPPO" required>
                </div>
                <div class="form-group">
                    <label>Acquirente (Riceve la merce):</label>
                    <input type="text" id="acquirente" placeholder="Nome acquirente" required>
                </div>
                <div class="form-group">
                    <label>Riferimento Fattura:</label>
                    <input type="text" id="riferimento_fattura" placeholder="Es. Fatt. 123/A">
                </div>
                <div class="form-group">
                    <label>Riferimento Deal:</label>
                    <input type="text" id="riferimento_deal" placeholder="Es. Deal #987">
                </div>
                <div class="form-group">
                    <label>Data Ordine:</label>
                    <input type="date" id="data_ordine" required>
                </div>
                <div class="form-group">
                    <label>Prodotti (Nome e Modello):</label>
                    <input type="text" id="prodotti" placeholder="Es. Smartphone X, Modello Pro" required>
                </div>
                <button type="submit">Invia Ordine</button>
            </form>
        </div>

        <!-- Sezione Dashboard Giacenze -->
        <div class="section">
            <h2>Dashboard Giacenze Magazzino</h2>
            <table>
                <thead>
                    <tr>
                        <th>Magazzino</th>
                        <th>Prodotto</th>
                        <th>Modello</th>
                        <th>Quantità Disponibile</th>
                    </tr>
                pel</tr>
                <tbody id="tabellaGiacenze">
                    <tr><td colspan="4" style="text-align: center;">Caricamento giacenze in corso...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ⚠️ IMPORTANTE: Sostituisci questo indirizzo con il link esatto che ti ha dato Render del tuo backend!
        const API_URL = "https://TUO-SERVIZIO.onrender.com";

        // Funzione per mostrare la notifica visiva a schermo
        function mostraNotifica(testo) {
            const notifica = document.getElementById('notifica');
            notifica.innerText = testo;
            notifica.style.display = 'block';
            setTimeout(() => {
                notifica.style.display = 'none';
            }, 4000); // Scompare dopo 4 secondi
        }

        // Caricamento Giacenze all'avvio
        async function caricaGiacenze() {
            try {
                const risposta = await fetch(`${API_URL}/api/giacenze`);
                const dati = await risposta.json();
                const tbody = document.getElementById('tabellaGiacenze');
                tbody.innerHTML = '';

                if (dati.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Nessuna giacenza registrata.</td></tr>';
                    return;
                }

                dati.forEach(g => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${g.magazzino_nome || 'Magazzino ' + g.magazzino_id}</td>
                            <td>${g.prodotto}</td>
                            <td>${g.modello}</td>
                            <td><b>${g.quantita}</b></td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Errore caricamento giacenze:", e);
            }
        }

        // Invio del modulo ordine
        document.getElementById('ordineForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nuovoOrdine = {
                magazzino_id: document.getElementById('magazzino_id').value,
                fornitore: document.getElementById('fornitore').value,
                venditore: document.getElementById('venditore').value,
                acquirente: document.getElementById('acquirente').value,
                riferimento_fattura: document.getElementById('riferimento_fattura').value,
                riferimento_deal: document.getElementById('riferimento_deal').value,
                data_ordine: document.getElementById('data_ordine').value,
                prodotti: document.getElementById('prodotti').value
            };

            try {
                const risposta = await fetch(`${API_URL}/api/ordini`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuovoOrdine)
                });
                const risultato = await risposta.json();
                
                if (risposta.ok) {
                    mostraNotifica("Ordine inviato con successo! Preso in carico.");
                    document.getElementById('ordineForm').reset();
                } else {
                    alert("Errore: " + risultato.errore);
                }
            } catch (err) {
                alert("Errore di connessione al server.");
            }
        });

        // Carica le giacenze appena si apre la pagina
        caricaGiacenze();
    </script>
</body>
</html>
